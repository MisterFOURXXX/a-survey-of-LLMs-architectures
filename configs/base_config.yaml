# Base configuration shared across all models
data:
  max_length: 128
  test_size: 0.05 # 0.2
  val_size: 0.3
  random_state: 42
  score_threshold: 5
  max_questions: 100

training:
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2e-5
  weight_decay: 0.01
  warmup_steps: 100
  lr_scheduler_type: "cosine"
  max_grad_norm: 0.5
  logging_strategy: "epoch"
  eval_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  report_to: "none"
  bf16: true
  gradient_checkpointing: true

evaluation:
  max_new_tokens: 100
  strategies:
    - greedy
    - beam_search
    - top_k
    - top_p
    - temperature_sampling