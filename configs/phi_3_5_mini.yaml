model:
  name: "microsoft/Phi-3.5-mini-instruct"
  output_dir: "./outputs/phi-3.5-mini-qlora"
  use_peft: true
  use_quantization: true
  trust_remote_code: true

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

peft:
  r: 16
  lora_alpha: 32
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2e-5
  optim: "adamw_8bit"