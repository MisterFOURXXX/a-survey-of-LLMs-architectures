model:
  name: "microsoft/Phi-3.5-MoE-instruct"
  output_dir: "./outputs/phi-3.5-moe-lora"
  use_peft: true
  use_quantization: false
  trust_remote_code: false

peft:
  r: 16
  lora_alpha: 32
  target_modules:
    - "q_proj"
    - "v_proj"
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2e-5
  optim: "adamw_torch"