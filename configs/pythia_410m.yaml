model:
  name: "EleutherAI/pythia-410m"
  output_dir: "./outputs/pythia-410m-finetuned"
  use_peft: false
  use_quantization: false
  trust_remote_code: false

training:
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 1e-4
  optim: "adamw_torch"
  max_grad_norm: 1.0
  save_strategy: "no"
  load_best_model_at_end: false